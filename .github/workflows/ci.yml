name: Mingyu V2 CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build web & Worker assets (including API docs, OpenAPI, Skill ZIP)
        run: pnpm build

      - name: Build standalone MCP bundle
        run: pnpm build:mcp

      - name: Verify Worker & MCP profiles
        run: |
          pnpm check:worker-profile
          pnpm check:mcp-profile
