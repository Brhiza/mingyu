services:
  mingyu:
    build:
      context: .
      args:
        VITE_ENABLE_DONATION_BOX: ${VITE_ENABLE_DONATION_BOX:-false}
    ports:
      - '3000:3000'
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-DeepSeek}
      AI_BUILTIN_ENABLED: ${AI_BUILTIN_ENABLED:-false}
      AI_DEFAULT_ENABLED: ${AI_DEFAULT_ENABLED:-false}
      AI_RATE_LIMIT_MAX_REQUESTS: ${AI_RATE_LIMIT_MAX_REQUESTS:-12}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-600}
      AI_STREAM_IDLE_TIMEOUT_MS: ${AI_STREAM_IDLE_TIMEOUT_MS:-30000}
      AI_STREAM_TOTAL_TIMEOUT_MS: ${AI_STREAM_TOTAL_TIMEOUT_MS:-95000}
      AI_TRUST_PROXY: ${AI_TRUST_PROXY:-false}
